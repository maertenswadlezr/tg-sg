# TeleOpenLink - Telegram 外部链接跳转至 Swiftgram
# 原作者: Li Khixang | QX 转换版

# s/ 短链 — 指定消息
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/s\/([A-Za-z0-9_]+)\/([0-9]+)$ url 302 sg://resolve?domain=$2&post=$3

# s/ 短链 — 用户 / 频道 / 群组
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/s\/([A-Za-z0-9_]+)$ url 302 sg://resolve?domain=$2

# 贴纸包
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/addstickers\/(.+)$ url 302 sg://addstickers?set=$2

# 分享 URL
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/share\/url\?(.+)$ url 302 sg://msg_url?$2

# 用户 / 频道 / 群组（不含查询参数）
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/([A-Za-z0-9_]+)$ url 302 sg://resolve?domain=$2

# Bot 链接（含 start 等查询参数）
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/([A-Za-z0-9_]+)\?(.+)$ url 302 sg://resolve?domain=$2&$3

# 指定消息
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/([A-Za-z0-9_]+)\/([0-9]+)$ url 302 sg://resolve?domain=$2&post=$3

# 邀请链接（joinchat / +）
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/(joinchat\/|\+)([A-Za-z0-9_-]+)$ url 302 sg://join?invite=$3

# 私有频道消息
^https?:\/\/(t\.me|telegram\.me|telegram\.dog)\/c\/([0-9]+)\/([0-9]+)$ url 302 sg://privatepost?channel=$2&post=$3

# 预览页
^https?:\/\/telesco\.pe\/(.+)$ url 302 sg://resolve?domain=$1
